<!doctype html>
<html lang="en">
  <head>
    <title>TensorFlow.js linear regression</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-vis"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
  </head>

  <body>
    <script type="text/javascript">
      async function plot(
        pointsArray,
        featureName,
        predictedPointsArray = null,
      ) {
        const values = [pointsArray.slice(0, 1000)];
        const series = ["original"];
        if (Array.isArray(predictedPointsArray)) {
          values.push(predictedPointsArray);
          series.push("predicted");
        }

        tfvis.render.scatterplot(
          { name: `${featureName} vs Weight` },
          { values, series },
          {
            xLabel: featureName,
            yLabel: "Weight",
            xAxisDomain: [100, 250],
            yAxisDomain: [0, 150],
          },
        );
      }

      async function plotPredictionLine() {
        const [xs, ys] = tf.tidy(() => {
          const normalisedXs = tf.linspace(0, 1, 100);
          const normalisedYs = model.predict(normalisedXs.reshape([100, 1]));

          const xs = denormalise(
            normalisedXs,
            normalisedFeature.min,
            normalisedFeature.max,
          );
          const ys = denormalise(
            normalisedYs,
            normalisedLabel.min,
            normalisedLabel.max,
          );

          return [xs.dataSync(), ys.dataSync()];
        });

        const predictedPoints = Array.from(xs).map((val, index) => {
          return { x: val, y: ys[index] };
        });

        await plot(points, "Height", predictedPoints);
      }

      /**
       ** NORMALISE — omskriver data til værdier mellem 0 og 1 *
       * Hvorfor: Modellen træner dårligt hvis data har stor skala (fx højde i 100-vis, vægt i 10-vis).
       * Når alt er 0-1 lærer modellen hurtigere og mere stabilt.
       *
       * Hvordan:
       *   - Finder mindste værdi i tensor med .min()
       *   - Finder største værdi i tensor med .max()
       *   - Beregner: (værdi - min) / (max - min)
       *   - Resultat: alle værdier lander mellem 0 og 1
       *
       * previousMin / previousMax bruges til denormalise() senere —
       * så vi kan regne tilbage til de originale værdier.
       */
      function normalise(tensor, previousMin = null, previousMax = null) {
        const min = previousMin || tensor.min();
        const max = previousMax || tensor.max();
        const normalisedTensor = tensor.sub(min).div(max.sub(min));
        return {
          tensor: normalisedTensor,
          min,
          max,
        };
      }

      /**
       * DENORMALISE — oversætter normaliserede værdier tilbage til original skala
       *
       * Hvorfor: Modellen forudsiger tal mellem 0-1, men vi vil have svaret i
       * rigtige enheder (fx kilo eller cm).
       *
       * Formel: (normaliseret × (max - min)) + min
       *
       * Eksempel: 0.5 × (200 - 150) + 150 = 175cm
       *
       * min og max hentes fra normalise() — derfor gemte vi dem der.
       */
      function denormalise(tensor, min, max) {
        const denormalisedTensor = tensor.mul(max.sub(min)).add(min);
        return denormalisedTensor;
      }

      let model;
      let optimizer;

      /**
       * CREATEMODEL — bygger og konfigurerer det neurale netværk
       *
       * Sequential: data flyder gennem ét lag ad gangen
       *
       * Dense layer:
       *   - units: 1        ét output (vægt)
       *   - inputDim: 1     ét input (højde)
       *   - useBias: true   tilføjer b i formlen y = ax + b
       *   - activation: 'linear' → ingen transformation, passer til regression
       *
       * compile — gør modellen klar til træning:
       *   - optimizer: SGD med learning rate 0.1 → justerer vægte under træning
       *   - loss: meanSquaredError → måler hvor forkert modellen er
       *
       * Hvorfor SGD: Simpel optimizer der passer til lineær regression.
       * Justerer modellens vægte efter hver batch ved at følge hældningen
       * af loss-funktionen nedad mod minimum.
       *
       * Learning rate 0.1: Størrelsen på hvert justeringsskridt.
       * For lille → lærer langsomt. For stor → overshoots, lærer ikke.
       *
       * Analogien: Gå ned ad en bakke i tåge — ét skridt ad gangen
       * i den retning det hælder mest nedad.
       */
      function createModel() {
        model = tf.sequential();

        model.add(
          tf.layers.dense({
            units: 1,
            useBias: true,
            activation: "linear",
            inputDim: 1,
          }),
        );

        optimizer = tf.train.sgd(0.1);

        model.compile({
          loss: "meanSquaredError",
          optimizer,
        });

        return model;
      }

      /**
       * TRAINMODEL — træner modellen på data
       *
       * Parametre:
       *   trainingFeatureTensor: 50% af højde-data (input) — modellen lærer på disse - kommer fra tf.split() i run
       *   trainingLabelTensor:   50% af vægt-data (rigtige svar) — modellen skal ramme disse - kommer fra tf.split() i run
       *
       * model.fit() kører selve træningsloopet:
       *   batchSize: 34     → data opdeles i bidder på 34 før vægtene justeres
       *   epochs: 20        → hele datasættet køres igennem 20 gange (~294 justeringer per epoch)
       *   validationSplit:  → 20% af data holdes tilbage til validering — aldrig brugt til træning
       *                       Formål: opdage overfitting (loss falder men val_loss stiger)
       *
       * Callbacks — kører automatisk under træning:
       *   onEpochEnd:   → opdaterer loss-kurven i TFVis i realtid
       *   onEpochBegin: → tegner den røde forudsigelseslinje på grafen
       *                 → viser aktuelle vægte og bias i TFVis
       */
      async function trainModel(
        model,
        trainingFeatureTensor,
        trainingLabelTensor,
      ) {
        const { onBatchEnd, onEpochEnd } = tfvis.show.fitCallbacks(
          { name: "Training Performance" },
          ["loss"],
        );
        // model.fit er hvor selve træningen sker — den justerer modellens vægte for at minimere loss
        return model.fit(trainingFeatureTensor, trainingLabelTensor, {
          batchSize: 34,
          epochs: 20,
          validationSplit: 0.2,
          callbacks: {
            onEpochEnd,
            onEpochBegin: async function () {
              await plotPredictionLine();
              const layer = model.getLayer(undefined, 0);
              tfvis.show.layer({ name: "Layer 1" }, layer);
            },
          },
        });
      }

      /**
        * PREDICT — forudsiger vægt ud fra højde-input
        *
        * 1. Henter brugerens input fra HTML
        * 2. Validerer at det er et tal over 100
        * 3. tf.tidy() → rydder automatisk tensors fra RAM bagefter
        * 4. Konverterer tal → tensor (inputTensor)
        * 5. Normaliserer input med samme min/max som træningsdata
        * 6. Kører modellen: model.predict() → normaliseret output
        * 7. Denormaliserer tilbage til rigtige kilo
        * 8. .dataSync()[0] → henter tal ud af tensor
        * 9. toFixed(1) → afrunder til 1 decimal
        * 10. Viser resultatet i HTML
        */
      async function predict() {
        const predictionInput = parseInt(document.getElementById("prediction-input").value, );

        if (isNaN(predictionInput)) 
        {
          alert("Please enter a valid number");
        } else if (predictionInput < 100) 
        {
          alert("Please enter a value above 100 cm");
        } else {
          tf.tidy(() => {
            // Konverter input til 1 dimensionel tensor
            const inputTensor = tf.tensor1d([predictionInput]);
            
            const normalisedInput = normalise(
              inputTensor,
              normalisedFeature.min,
              normalisedFeature.max,
            );
            
            const normalisedOutputTensor = model.predict(normalisedInput.tensor,);

            const outputTensor = denormalise(
              normalisedOutputTensor,
              normalisedLabel.min,
              normalisedLabel.max,
            );

            const outputValue = outputTensor.dataSync()[0];

            const outputValueRounded = outputValue.toFixed(1);

            document.getElementById("prediction-output").innerHTML =
              `The predicted weight is <br>` +
              `<span style="font-size: 2em">${outputValueRounded} kg</span>`;
          });
        }
      }

      const storageID = "weight-height-model";
      async function save() {
        const saveResults = await model.save(`localstorage://${storageID}`);
        //document.getElementById("model-status").innerHTML =
        //  `Trained (saved ${saveResults.modelArtifactsInfo.dateSaved})`;
        document.getElementById("model-status").innerHTML =
          `Trained (saved ${selectedGender} - ${saveResults.modelArtifactsInfo.dateSaved})`;
        document.getElementById("load-button").removeAttribute("disabled");
      }

      async function load() {
        const storageKey = `localstorage://${storageID}`;
        const models = await tf.io.listModels();
        const modelInfo = models[storageKey];
        if (modelInfo) {
          model = await tf.loadLayersModel(storageKey);
          optimizer = tf.train.sgd(0.1);
          model.compile({
            // Her bruges MSE som loss evaluering der måler hvor forkert modellen er som et tal - jo lavere loss tal jo mere præcis model
            loss: "meanSquaredError",
            optimizer,
          });

          tfvis.show.modelSummary({ name: "Model summary" }, model);
          const layer = model.getLayer(undefined, 0);
          tfvis.show.layer({ name: "Layer 1" }, layer);

          await plotPredictionLine();

          //document.getElementById("model-status").innerHTML =
          //  `Loaded model (saved ${modelInfo.dateSaved})`;
          document.getElementById("model-status").innerHTML =
            `Loaded model (${selectedGender} - ${modelInfo.dateSaved})`;
          document.getElementById("predict-button").removeAttribute("disabled");
          document.getElementById("test-button").removeAttribute("disabled");
        } else {
          alert("Could not load: no saved model found");
        }
      }

      async function test() {
        const lossTensor = model.evaluate(
          testingFeatureTensor,
          testingLabelTensor,
        );
        const loss = (await lossTensor.dataSync())[0];
        console.log(`Testing set loss: ${loss}`);

        document.getElementById("testing-status").innerHTML =
          `Testing set loss: ${loss.toPrecision(5)}`;
      }

      async function train() {
        // Disable all buttons and update status
        ["train", "test", "load", "predict", "save"].forEach((id) => {
          document
            .getElementById(`${id}-button`)
            .setAttribute("disabled", "disabled");
        });
        //document.getElementById("model-status").innerHTML = "Training...";
        document.getElementById("model-status").innerHTML = `Training ${selectedGender} model...`;

        const model = createModel();
        tfvis.show.modelSummary({ name: "Model summary" }, model);
        const layer = model.getLayer(undefined, 0);
        tfvis.show.layer({ name: "Layer 1" }, layer);
        await plotPredictionLine();

        const result = await trainModel(
          model,
          trainingFeatureTensor,
          trainingLabelTensor,
        );
        console.log(result);
        const trainingLoss = result.history.loss.pop();
        console.log(`Training set loss: ${trainingLoss}`);
        const validationLoss = result.history.val_loss.pop();
        console.log(`Validation set loss: ${validationLoss}`);
        /*
        document.getElementById("model-status").innerHTML =
          "Trained (unsaved)\n" +
          `Loss: ${trainingLoss.toPrecision(5)}\n` +
          `Validation loss: ${validationLoss.toPrecision(5)}`;
          */
        document.getElementById("model-status").innerHTML =
          `Trained (unsaved) - ${selectedGender}\n` +
          `Loss: ${trainingLoss.toPrecision(5)}\n` +
          `Validation loss: ${validationLoss.toPrecision(5)}`;
        document.getElementById("test-button").removeAttribute("disabled");
        document.getElementById("save-button").removeAttribute("disabled");
        document.getElementById("predict-button").removeAttribute("disabled");
      }

      async function plotParams(weight, bias) {
        model.getLayer(null, 0).setWeights([
          tf.tensor2d([[weight]]), // Kernel (input multiplier)
          tf.tensor1d([bias]), // Bias
        ]);
        await plotPredictionLine();
        const layer = model.getLayer(undefined, 0);
        tfvis.show.layer({ name: "Layer 1" }, layer);
      }

      async function toggleVisor() {
        tfvis.visor().toggle();
      }

      let points;
      let normalisedFeature, normalisedLabel;
      let trainingFeatureTensor,
        testingFeatureTensor,
        trainingLabelTensor,
        testingLabelTensor;
      
      // Variabel til at holde styr på om der er valgt Male eller female
      let selectedGender = "Male";


      async function setGender(gender) {
        selectedGender = gender;
        
        // Opdater knapper visuelt
        document.getElementById("male-button").className = 
          gender === "Male" 
          ? "waves-effect light-blue waves-light btn" 
          : "waves-effect light-blue waves-light btn-small";
          
        document.getElementById("female-button").className = 
          gender === "Female" 
          ? "waves-effect light-blue waves-light btn" 
          : "waves-effect light-blue waves-light btn-small";

        // Genkør data med nyt kønsfilter
        await run();
      }

      async function run() {
        // Ensure backend has initialized
        await tf.ready();

        // Import from CSV
        const houseSalesDataset = tf.data.csv("weight-height.csv");

        // Filtrer data baseret på valgt køn
       const pointsDataset = houseSalesDataset
        .filter((record) => record.Gender === selectedGender)
        .map((record) => ({
          x: record.Height * 2.54,
          y: record.Weight * 0.45359237,
        }));

        points = await pointsDataset.toArray();
        if (points.length % 2 !== 0) {
          // If odd number of elements
          points.pop(); // remove one element
        }

        // Datasæt shuffles så model ikke lære så hurtig - minimere overfitting 
        tf.util.shuffle(points);
        
        plot(points, "Height");

        // Data splittese nu op i 2 tensors: featureTensor (højde) og labelsTensor (vægt)
        const featureValues = points.map((p) => p.x);
        const featureTensor = tf.tensor2d(featureValues, [
          featureValues.length,
          1,
        ]);

        // Samme for labels (vægt)
        const labelValues = points.map((p) => p.y);
        const labelTensor = tf.tensor2d(labelValues, [labelValues.length, 1]);

        // Normalise features and labels
        normalisedFeature = normalise(featureTensor);
        normalisedLabel = normalise(labelTensor);

        // disposer originale tensors for at frigøre RAM — vi bruger kun normaliserede versioner fremover
        featureTensor.dispose();
        labelTensor.dispose();

        // Split data into training and testing sets (50/50 split)
        [trainingFeatureTensor, testingFeatureTensor] = tf.split(
          normalisedFeature.tensor,
          2,
        );
        [trainingLabelTensor, testingLabelTensor] = tf.split(
          normalisedLabel.tensor,
          2,
        );

        // Opdater UI og aktiver knappen Train
        //document.getElementById("model-status").innerHTML = "No model trained";
        document.getElementById("model-status").innerHTML = `No model trained - showing ${selectedGender} data`;
        document.getElementById("train-button").removeAttribute("disabled");
        document.getElementById("load-button").removeAttribute("disabled");
      }

      run();
    </script>

    <!--   Header   -->
    <div class="section no-pad-bot" id="index-banner">
      <div class="container">
        <h5 class="header center blue-text small">
          Linear regression with TensorFlow.js
        </h5>
        <div class="row center">
          <h6 class="header col s12 light">
            Train a model to predict house price from living space.
          </h6>
        </div>
      </div>
    </div>

    <!--   Misc buttons   -->
    <div class="section no-pad-bot light-blue lighten-4">
      <div class="container">
        <div class="row center">
          <button
            id="toggle-button"
            class="waves-effect waves-light light-blue btn-small"
            onclick="toggleVisor()"
          >
            Toggle Visor
          </button>
          <br /><br />
        </div>
      </div>
    </div>

    <!--   Main functionality   -->
    <div class="container">
      <div class="section">
        <div class="row">
          <!--   Training   -->
          <div class="col s12 m6">
            <div class="icon-block">
              <h3 class="center light-blue-text">
                <i class="material-icons" style="font-size: 2em">build</i>
              </h3>
              <h5 class="center">Train & Test</h5>

              <p class="light"></p>

              <!-- Kønsfilter -->
            <div style="margin-bottom: 10px;">
              <label>Select gender:</label><br>
              <button
                id="male-button"
                class="waves-effect light-blue waves-light btn-small"
                onclick="setGender('Male')">
                Male
              </button>
              <button
                id="female-button"
                class="waves-effect light-blue waves-light btn-small"
                onclick="setGender('Female')">
                Female
              </button>
            </div>

              <div>
                <p><label>Training status:</label></p>
                <pre
                  class="grey lighten-4"
                  style="overflow-x: auto"
                ><em id="model-status">Loading data...</em></pre>

                <p><label>Testing status:</label></p>
                <pre
                  class="grey lighten-4"
                  style="overflow-x: auto"
                ><em id="testing-status">Not yet tested</em></pre>

                <button
                  autocomplete="off"
                  id="train-button"
                  class="waves-effect light-blue waves-light btn"
                  disabled
                  onclick="train()"
                >
                  Train New Model
                </button>
                <button
                  autocomplete="off"
                  id="test-button"
                  class="waves-effect light-blue waves-light btn"
                  disabled
                  onclick="test()"
                >
                  Test Model
                </button>
              </div>
              <br />

              <div>
                <button
                  autocomplete="off"
                  id="load-button"
                  class="waves-effect light-blue waves-light btn-small"
                  disabled
                  onclick="load()"
                >
                  Load Model
                </button>
                <button
                  autocomplete="off"
                  id="save-button"
                  class="waves-effect light-blue waves-light btn-small"
                  disabled
                  onclick="save()"
                >
                  Save Model
                </button>
              </div>
            </div>
          </div>

          <!--   Prediction   -->
          <div class="col s12 m6">
            <div class="icon-block">
              <h3 class="center light-blue-text">
                <i class="material-icons" style="font-size: 2em">timeline</i>
              </h3>
              <h5 class="center">Predict</h5>

              <label
                >Height (cm):
                <input type="number" id="prediction-input" placeholder="170"
              /></label>
              <button
                autocomplete="off"
                id="predict-button"
                class="waves-effect light-blue waves-light btn"
                disabled
                onclick="predict()"
              >
                Predict weight
              </button>
              <p><strong id="prediction-output"></strong></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
