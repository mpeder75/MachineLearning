<!doctype html>
<html lang="en">
  <head>
    <title>TensorFlow.js binary classification</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-vis"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <style>
      /* --- HER KAN DU ÆNDRE FARVERNE --- */
      :root {
        --main-theme-color: #7d2e3f; /* Den mørkegrønne farve */
        --light-theme-bg: #f8e9ee; /* Den lysegrønne baggrund */
        --button-hover-color: #5e1b1b; /* Farve ved hover på knapper */
      }

      /* Overskrifter og ikoner */
      .green-text.small,
      .red-text,
      .material-icons {
        color: var(--main-theme-color) !important;
      }

      /* Baggrundssektioner */
      .red.lighten-4 {
        background-color: var(--light-theme-bg) !important;
      }

      /* Knapper */
      .btn,
      .btn-small,
      .red {
        background-color: var(--main-theme-color) !important;
      }

      .btn:hover,
      .btn-small:hover {
        background-color: var(--button-hover-color) !important;
      }

      /* Status felter */
      pre.grey.lighten-4 {
        border-left: 5px solid var(--main-theme-color);
      }
    </style>
  </head>
  <body>
    <script type="text/javascript">
      async function plotClasses(
        pointsArray,
        classKey,
        size = 400,
        equalizeClassSizes = false,
      ) {
        const allSeries = {};
        pointsArray.forEach((p) => {
          const seriesName = `${classKey}: ${p.class}`;
          let series = allSeries[seriesName];
          if (!series) {
            series = [];
            allSeries[seriesName] = series;
          }
          series.push(p);
        });

        if (equalizeClassSizes) {
          let maxLength = null;
          Object.values(allSeries).forEach((series) => {
            if (
              maxLength === null ||
              (series.length < maxLength && series.length >= 100)
            ) {
              maxLength = series.length;
            }
          });
          Object.keys(allSeries).forEach((keyName) => {
            allSeries[keyName] = allSeries[keyName].slice(0, maxLength);
            if (allSeries[keyName].length < 100) {
              delete allSeries[keyName];
            }
          });
        }

        tfvis.render.scatterplot(
          {
            name: `Square feet vs House Price`,
            styles: { width: "100%" },
          },
          {
            values: Object.values(allSeries),
            series: Object.keys(allSeries),
          },
          {
            xLabel: "Square feet",
            yLabel: "Price",
            height: size,
            width: size * 1.5,
          },
        );
      }

      async function plotPredictionHeatmap(
        name = "Predicted class",
        size = 400,
      ) {
        const [valuesPromise, xTicksPromise, yTicksPromise] = tf.tidy(() => {
          const gridSize = 50;
          const predictionColumns = [];

          for (let colIndex = 0; colIndex < gridSize; colIndex++) {
            const colInputs = [];
            const x = colIndex / gridSize;
            for (let rowIndex = 0; rowIndex < gridSize; rowIndex++) {
              const y = (gridSize - rowIndex) / gridSize;
              colInputs.push([x, y]);
            }
            const colPredictions = model.predict(tf.tensor2d(colInputs));
            predictionColumns.push(colPredictions);
          }
          const valuesTensor = tf.stack(predictionColumns);

          const normalisedTicksTensor = tf.linspace(0, 1, gridSize);
          const xTicksTensor = denormalise(
            normalisedTicksTensor,
            normalisedFeature.min[0],
            normalisedFeature.max[0],
          );
          const yTicksTensor = denormalise(
            normalisedTicksTensor.reverse(),
            normalisedFeature.min[1],
            normalisedFeature.max[1],
          );

          return [
            valuesTensor.array(),
            xTicksTensor.array(),
            yTicksTensor.array(),
          ];
        });

        const values = await valuesPromise;
        const xTicks = await xTicksPromise;
        const yTicks = await yTicksPromise;
        const xTickLabels = xTicks.map((v) => (v / 1000).toFixed(1) + "k sqft");
        const yTickLabels = yTicks.map((v) => "$" + (v / 1000).toFixed(0) + "k");

        tf.unstack(values, 2).forEach((values, i) => {
          const data = {
            values,
            xTickLabels,
            yTickLabels,
          };

          tfvis.render.heatmap(
            {
              name: `Bedrooms: ${getClassName(i)} (local)`,
              tab: "Predictions",
            }, data, { height: size });

          tfvis.render.heatmap(
            {
              name: `Bedrooms: ${getClassName(i)} (full domain)`,
              tab: "Predictions",
            }, data, { height: size, domain: [0, 1] });
        });
      }

      function normalise(tensor, previousMin = null, previousMax = null) {
        const featureDimensions = tensor.shape.length > 1 && tensor.shape[1];
        if (featureDimensions && featureDimensions > 1) {
          const features = tf.split(tensor, featureDimensions, 1);
          const normalisedFeatures = features.map((featureTensor, i) =>
            normalise(
              featureTensor,
              previousMin ? previousMin[i] : null,
              previousMax ? previousMax[i] : null,
            ),
          );
          const returnTensor = tf.concat(
            normalisedFeatures.map((f) => f.tensor),
            1,
          );
          const min = normalisedFeatures.map((f) => f.min);
          const max = normalisedFeatures.map((f) => f.max);
          return { tensor: returnTensor, min, max };
        } else {
          const min = previousMin || tensor.min();
          const max = previousMax || tensor.max();
          const normalisedTensor = tensor.sub(min).div(max.sub(min));
          return { tensor: normalisedTensor, min, max };
        }
      }

      function denormalise(tensor, min, max) {
        const featureDimensions = tensor.shape.length > 1 && tensor.shape[1];
        if (featureDimensions && featureDimensions > 1) {
          const features = tf.split(tensor, featureDimensions, 1);
          const denormalised = features.map((featureTensor, i) =>
            denormalise(featureTensor, min[i], max[i]),
          );
          return tf.concat(denormalised, 1);
        } else {
          return tensor.mul(max.sub(min)).add(min);
        }
      }

      let model;
      function createModel() {
        model = tf.sequential();
        model.add(
          tf.layers.dense({units: 10, useBias: true, activation: "sigmoid", inputDim: 2,}),
        );
        model.add(
          tf.layers.dense({ units: 10, useBias: true, activation: "sigmoid" }),
        );
        model.add(
          tf.layers.dense({ units: 3, useBias: true, activation: "softmax" }),
        );
        model.compile({
          loss: "categoricalCrossentropy",
          optimizer: tf.train.adam(),
        });
        return model;
      }

      async function trainModel(
        model,
        trainingFeatureTensor,
        trainingLabelTensor,
      ) {
        const { onEpochEnd } = tfvis.show.fitCallbacks(
          { name: "Training Performance" },
          ["loss"],
        );
        return model.fit(trainingFeatureTensor, trainingLabelTensor, {
          batchSize: 32,
          epochs: 50, // Sat til 50 for hurtigere test, ændr tilbage til 2000 hvis nødvendigt
          validationSplit: 0.2,
          callbacks: {
            onEpochEnd,
            onEpochBegin: async function () {
              await plotPredictionHeatmap();
            },
          },
        });
      }

      async function predict() {
        const p1 = parseInt(
          document.getElementById("prediction-input-1").value,
        );
        const p2 = parseInt(
          document.getElementById("prediction-input-2").value,
        );
        if (isNaN(p1) || isNaN(p2)) return alert("Indtast venligst tal");

        tf.tidy(() => {
          const inputTensor = tf.tensor2d([[p1, p2]]);
          const normalisedInput = normalise(
            inputTensor,
            normalisedFeature.min,
            normalisedFeature.max,
          );
          const prediction = model.predict(normalisedInput.tensor);

          const outputs = prediction.dataSync();
          let outputString = "";
          for (let i = 0; i < 3; i++) 
          {
            outputString += `Likelihood of having ${getClassName(i)} bedrooms is: ${(100 * outputs[i]).toFixed(1)}%<br>`;
          }
          document.getElementById("prediction-output").innerHTML = outputString;
        });
      }

      const storageID = "kc-house-price-multi";
      async function save() {
        await model.save(`localstorage://${storageID}`);
        document.getElementById("model-status").innerHTML = "Model Saved!";
      }

      async function load() {
        const storageKey = `localstorage://${storageID}`;
        const models = await tf.io.listModels();
        if (models[storageKey]) {
          model = await tf.loadLayersModel(storageKey);
          await plotPredictionHeatmap();
          document.getElementById("model-status").innerHTML = "Model Loaded!";
          document.getElementById("predict-button").removeAttribute("disabled");
        }
      }

      async function test() {
        const lossTensor = model.evaluate(
          testingFeatureTensor,
          testingLabelTensor,
        );
        const loss = (await lossTensor.dataSync())[0];
        document.getElementById("testing-status").innerHTML =
          `Loss: ${loss.toPrecision(5)}`;
      }

      async function train() {
        ["train", "test", "load", "predict", "save"].forEach((id) =>
          document
            .getElementById(`${id}-button`)
            .setAttribute("disabled", "disabled"),
        );
        document.getElementById("model-status").innerHTML = "Training...";
        model = createModel();
        const result = await trainModel(
          model,
          trainingFeatureTensor,
          trainingLabelTensor,
        );
        document.getElementById("model-status").innerHTML = "Trained!";
        ["test", "save", "predict"].forEach((id) =>
          document.getElementById(`${id}-button`).removeAttribute("disabled"),
        );
      }

      async function toggleVisor() {
        tfvis.visor().toggle();
      }

      let points,
        normalisedFeature,
        normalisedLabel,
        trainingFeatureTensor,
        testingFeatureTensor,
        trainingLabelTensor,
        testingLabelTensor;

      async function run() {
        await tf.ready();
        const houseSalesDataset = tf.data.csv("./kc_house_data.csv");
        const pointsDataset = houseSalesDataset
          .map((record) => ({
            x: record.sqft_living,
            y: record.price,
            class: record.bedrooms > 2 ? "3+" : record.bedrooms,
          }))
          .filter((r) => r.class !== 0);
        points = await pointsDataset.toArray();
        if (points.length % 2 !== 0) points.pop();
        tf.util.shuffle(points);
        plotClasses(points, "Bedrooms");

        const featureValues = points.map((p) => [p.x, p.y]);
        const labelValues = points.map((p) => getClassIndex(p.class));
        const labelTensor = tf.tidy(() =>
          tf.oneHot(tf.tensor1d(labelValues, "int32"), 3),
        );

        normalisedFeature = normalise(tf.tensor2d(featureValues));
        [trainingFeatureTensor, testingFeatureTensor] = tf.split(
          normalisedFeature.tensor,
          2,
        );
        [trainingLabelTensor, testingLabelTensor] = tf.split(labelTensor, 2);

        document.getElementById("model-status").innerHTML = "Data Ready";
        document.getElementById("train-button").removeAttribute("disabled");
        document.getElementById("load-button").removeAttribute("disabled");
      }

      function getClassIndex(className) {
        if (className === 1 || className === "1") {
          return 0; // 1 bedroom
        } else if (className === 2 || className === "2") {
          return 1; // 2 bedrooms
        } else {
          return 2; // 3 bedrooms
        }
      }

      function getClassName(classIndex) {
        if (classIndex === 2) return "3+";
        else return classIndex + 1;
      }

      run();
    </script>

    <div class="section no-pad-bot">
      <div class="container">
        <h5 class="header center green-text small">
          Multi-class classification with TensorFlow.js
        </h5>
        <div class="row center">
          <h6 class="header col s12 light">
            Train a model to predict the number of bedrooms in a house
          </h6>
        </div>
      </div>
    </div>

    <div class="section no-pad-bot red lighten-4">
      <div class="container">
        <div class="row center">
          <button
            id="toggle-button"
            class="waves-effect waves-light btn-small"
            onclick="toggleVisor()"
          >
            Toggle Visor
          </button>
          <br /><br />
        </div>
      </div>
    </div>

    <div class="container">
      <div class="section">
        <div class="row">
          <div class="col s12 m6">
            <div class="icon-block">
              <h3 class="center red-text">
                <i class="material-icons" style="font-size: 2em">build</i>
              </h3>
              <h5 class="center">Train & Test</h5>
              <div>
                <p><label>Training status:</label></p>
                <pre
                  class="grey lighten-4"
                ><em id="model-status">Loading data...</em></pre>
                <p><label>Testing status:</label></p>
                <pre
                  class="grey lighten-4"
                ><em id="testing-status">Not yet tested</em></pre>
                <button
                  id="train-button"
                  class="waves-effect btn"
                  disabled
                  onclick="train()"
                >
                  Train New Model
                </button>
                <button
                  id="test-button"
                  class="waves-effect btn"
                  disabled
                  onclick="test()"
                >
                  Test Model
                </button>
              </div>
              <br />
              <button
                id="load-button"
                class="waves-effect btn-small"
                disabled
                onclick="load()"
              >
                Load Model
              </button>
              <button
                id="save-button"
                class="waves-effect btn-small"
                disabled
                onclick="save()"
              >
                Save Model
              </button>
            </div>
          </div>

          <div class="col s12 m6">
            <div class="icon-block">
              <h3 class="center red-text">
                <i class="material-icons" style="font-size: 2em">timeline</i>
              </h3>
              <h5 class="center">Predict</h5>
              <label
                >Square feet:
                <input type="number" id="prediction-input-1" placeholder="2000"
              /></label>
              <label
                >House price ($):
                <input
                  type="number"
                  id="prediction-input-2"
                  placeholder="1000000"
              /></label>
              <button
                id="predict-button"
                class="waves-effect btn"
                disabled
                onclick="predict()"
              >
                Predict class
              </button>
              <p><strong id="prediction-output"></strong></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
